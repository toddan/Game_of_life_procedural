<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Game of Life</title>
    <style>
        body
        {
            background-color: #222222;
            color: #dddddd;
            font-family: monospace;
            text-align: center;
        }

        button
        {
            font-family: monospace;
            font-size: 16px;
            padding: 6px 24px;
        }

        canvas
        {
            border: 1px solid #555555;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <h1>Game of Life</h1>

    <p>
        Move the cursor with the arrow keys and press the spacebar to plant a cell.<br>
        You can also click on the board to plant a cell.<br>
        then press s (or the Start button) to start the simulation.
    </p>

    <p>
        <button id="start">Start</button>
    </p>

    <!-- The game is drawn on this canvas. 50 cells * 16 pixels = 800, 25 cells * 16 pixels = 400 -->
    <canvas id="board" width="800" height="400"></canvas>

    <script src="game_of_life.js"></script>
</body>
</html>
